# ==============================================================================
# Remote Elephant Fence Telemetry Data Simulator Configuration
# ==============================================================================

server:
  base_url: "http://localhost:8080"
  ingest_endpoint: "/api/v1/telemetry/ingest"
  timeout_seconds: 5
  retry_attempts: 3
  retry_delay_seconds: 1.0

simulation:
  # Cycle duration for each gateway in seconds (default: 60s)
  interval_seconds: 60
  # Stagger gateway start times across the cycle so gateways don't all transmit at the exact same millisecond
  stagger_gateways: true
  # Mode: 'continuous' or 'manual'
  mode: "continuous"
  # Add slight random noise to simulate natural solar/weather jitter
  enable_jitter: true
  # Simulate diurnal solar cycle based on local clock time
  simulate_solar_battery: true

# Voltage generation bands (in kiloVolts, kV)
# Normal: 5.5 - 8.5 kV (Nominal 6.8 kV)
# Warning: 3.0 - 4.8 kV (Vegetation load / damp branches)
# Critical: 0.0 - 1.5 kV (Wire cut / Elephant breach)
voltage_profiles:
  normal:
    nominal_kv: 6.8
    min_kv: 5.5
    max_kv: 8.5
    noise_std: 0.15
  vegetation_warning:
    nominal_kv: 4.0
    min_kv: 3.0
    max_kv: 4.8
    noise_std: 0.25
  critical_breach:
    nominal_kv: 0.2
    min_kv: 0.0
    max_kv: 1.5
    noise_std: 0.10

