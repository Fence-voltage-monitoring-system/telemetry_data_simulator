# ==============================================================================
# Remote Elephant Fence Telemetry Data Simulator Configuration
# ==============================================================================

server:
  base_url: "http://localhost:8080"
  ingest_endpoint: "/api/v1/telemetry/ingest"
  timeout_seconds: 5
  retry_attempts: 3
  retry_delay_seconds: 1.0

simulation:
  # Cycle duration for each gateway in seconds (default: 60s)
  interval_seconds: 60
  # Stagger gateway start times across the cycle so gateways don't all transmit at the exact same millisecond
  stagger_gateways: true
  # Mode: 'continuous' or 'manual'
  mode: "continuous"
  # Add slight random noise to simulate natural solar/weather jitter
  enable_jitter: true
  # Simulate diurnal solar cycle based on local clock time
  simulate_solar_battery: true

# Voltage generation bands (in kiloVolts, kV)
voltage_profiles:
  normal:
    nominal_kv: 6.8
    min_kv: 5.5
    max_kv: 8.5
    noise_std: 0.15
  vegetation_warning:
    nominal_kv: 4.0
    min_kv: 3.0
    max_kv: 4.8
    noise_std: 0.25
  critical_breach:
    nominal_kv: 0.2
    min_kv: 0.0
    max_kv: 1.5
    noise_std: 0.10

# 5 Simulated Regional Gateways across Sri Lanka
gateways:
  - id: "GW-ANURADHAPURA-01"
    name: "Anuradhapura North Hub"
    location: "Wilpattu Border Zone"
    fences:
      - code: "FC-WILPATPU-01"
        name: "Wilpattu Border Protection Fence"
        devices:
          - serial: "SN-12345"
            section_code: "SEC-01"
            section_name: "Main Energizer Section"
            nominal_voltage: 7.2
            initial_state: "normal"
          - serial: "SN-E-01001"
            section_code: "SEC-02"
            section_name: "River Bank Sector"
            nominal_voltage: 6.8
            initial_state: "normal"
          - serial: "SN-E-01002"
